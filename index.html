                await apiFetch(`${API_URL}?action=reorder&items=${encodeURIComponent(JSON.stringify(items))}`);
            } catch (e) {
                group.forEach(t => { t.sortOrder = prevOrders.get(t.taskId); });
                renderTasks();
                alert('並び順の保存に失敗しました: ' + e.message);
            }
        }

        // ★修正：以前はfetchの結果を見ずに「送ったら成功」扱いしていた。
        // GASのdoGetは例外が起きてもHTTP 200({error:...})を返すため、res.okだけでは
        // 失敗を検知できず、画面はチェック済み/変更済みのまま、実データは更新されない
        // ……という「翌日になると戻る」不具合の原因になっていた。
        // 失敗したら画面側の状態も元に戻し、はっきりエラーを出すようにする。
        async function updateField(taskId, field, value) {
            const task = globalTasks.find(t => t.taskId === taskId);
            const prevValue = task ? task[field] : undefined;
            if (task) {
                task[field] = value;
                if (['assignee', 'category', 'deadline', 'priority'].includes(field)) {
                    setTimeout(renderTasks, 100);
                }
            }
            try {
                await apiFetch(
                    `${API_URL}?action=updateField&taskId=${taskId}&field=${field}&value=${encodeURIComponent(value)}`
                );
            } catch (e) {
                if (task) { task[field] = prevValue; renderTasks(); }
                alert('更新エラー: ' + e.message);
            }
        }

        async function toggleDetail(taskId, detailId, isChecked) {
            const task = globalTasks.find(t => t.taskId === taskId);
            const detail = task.details.find(d => d.detailId === detailId);
            const prevDone = detail ? detail.isDone : undefined;
            const prevStatus = task.status;
            if (detail) detail.isDone = isChecked;
            const allDone = task.details.length > 0 && task.details.every(d => d.isDone);
            task.status = allDone ? '完了' : '作業中';
            renderTasks();
            try {
                await apiFetch(
                    `${API_URL}?action=updateDetail&taskId=${taskId}&detailId=${detailId}&isDone=${isChecked}`
                );
            } catch (e) {
                if (detail) detail.isDone = prevDone;
                task.status = prevStatus;
                renderTasks();
                alert('保存に失敗したのでチェックを元に戻しました: ' + e.message);
            }
        }

        async function updateDetailContent(taskId, detailId, newContent) {
            const task = globalTasks.find(t => t.taskId === taskId);
            if (!task) return;
            const detail = task.details.find(d => d.detailId === detailId);
            if (!detail) return;
            const prevContent = detail.content;
            detail.content = newContent;
            renderTasks();
            try {
                await apiFetch(
                    `${API_URL}?action=editDetail&taskId=${taskId}&detailId=${detailId}&content=${encodeURIComponent(newContent)}`
                );
            } catch (e) {
                detail.content = prevContent;
                renderTasks();
                alert('明細の更新でエラーが発生しました: ' + e.message);
            }
        }

        async function addNewDetail(taskId, inputElement) {
            const content = inputElement.value.trim();
            if (!content) return;

            const task = globalTasks.find(t => t.taskId === taskId);
            const tempId = 'temp-' + Date.now();
            const prevStatus = task ? task.status : undefined;
            if (task) {
                task.details.push({
                    detailId: tempId,
                    content: content,
                    targetQuantity: '',
                    isDone: false
                });
                task.status = '作業中';
                renderTasks();
            }

            try {
                await apiFetch(
                    `${API_URL}?action=addDetail&taskId=${taskId}&content=${encodeURIComponent(content)}`
                );
            } catch (e) {
                if (task) {
                    task.details = task.details.filter(d => d.detailId !== tempId);
                    task.status = prevStatus;
                    renderTasks();
                }
                alert('追加通信でエラーが発生しました: ' + e.message);
            }
        }

        function openAssigneeModal(taskId) {
            currentEditingTaskId = taskId;
            const task = globalTasks.find(t => t.taskId === taskId);
            const currentAssignees = task && task.assignee
                ? String(task.assignee).split(',').map(s => s.trim())
                : [];
            const listContainer = document.getElementById('memberList');
            listContainer.innerHTML = '';
            globalMembers.forEach(m => {
                const isChecked = currentAssignees.includes(m.name) ? 'checked' : '';
                listContainer.insertAdjacentHTML(
                    'beforeend',
                    `<label class="member-item">
                        <input type="checkbox" class="member-checkbox" value="${m.name}" ${isChecked}>
                        ${m.name}
                     </label>`
                );
            });
            document.getElementById('assigneeModal').classList.add('show');
        }

        function closeAssigneeModal() {
            document.getElementById('assigneeModal').classList.remove('show');
            currentEditingTaskId = null;
        }

        function saveAssignees() {
            if (!currentEditingTaskId) return;
            const checkboxes = document.querySelectorAll('.member-checkbox:checked');
            const selectedNames = Array.from(checkboxes).map(cb => cb.value);
            const newValue = selectedNames.length > 0 ? selectedNames.join(', ') : '未定';
            updateField(currentEditingTaskId, 'assignee', newValue);
            closeAssigneeModal();
        }

        window.onload = initializeApp;
    </script>
</body>
</html>
